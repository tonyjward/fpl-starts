[project]
name = "fpl-starts"
version = "0.1.0"
description = "An interpretable, leakage-safe P(start) model for Fantasy Premier League, with archiving, evaluation and scoring"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31.0",
    "scikit-learn>=1.5",
]

[project.scripts]
fpl-starts-archive = "fpl_starts.archiver:_main"
fpl-starts-derive = "fpl_starts.derived:_main"
fpl-starts-score = "fpl_starts.scoring:_main"
fpl-starts-logistic-evaluate = "fpl_starts.ml.evaluate:_main"
fpl-starts-logistic-train = "fpl_starts.ml.train:_main"
fpl-starts-logistic-predict = "fpl_starts.ml.predict:_main"
fpl-starts-logistic-case-study = "fpl_starts.research.logistic_case_study:_main"
fpl-starts-refresh = "fpl_starts.refresh:_main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# dashboard/tests needs Streamlit, so it runs in the dashboard's own venv
# (`cd dashboard && uv run pytest`).
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=7.4.4"]
notebook = [
    "ipykernel>=7.3.0",
    "kaleido>=1.4.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "plotly>=7.1.0",
]
