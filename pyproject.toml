[project]
name = "fpl-starts"
version = "0.1.0"
description = "P(starts): FPL archiver, derived layer, base lookup-table model, and calibration harness"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0",
    "requests>=2.31.0",
    "scikit-learn>=1.5",
]

[project.scripts]
fpl-starts-archive = "fpl_starts.archiver:_main"
fpl-starts-derive = "fpl_starts.derived:_main"
fpl-starts-predict = "fpl_starts.starts_model:_main"
fpl-starts-score = "fpl_starts.scoring:_main"
fpl-starts-agent-predict = "fpl_starts.agent.predict:_main"
fpl-starts-agent-report = "fpl_starts.agent.domain_stats:_main"
fpl-starts-logistic-evaluate = "fpl_starts.ml.evaluate:_main"
fpl-starts-logistic-train = "fpl_starts.ml.train:_main"
fpl-starts-logistic-predict = "fpl_starts.ml.predict:_main"
fpl-starts-logistic-case-study = "fpl_starts.research.logistic_case_study:_main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest>=7.4.4"]
notebook = [
    "ipykernel>=7.3.0",
    "kaleido>=1.4.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "plotly>=7.1.0",
]
